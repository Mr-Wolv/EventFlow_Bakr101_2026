server:
  port: 8080

spring:
  application:
    name: order-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        # Do not embed type headers — consumers bind to their own event type
        spring.json.add.type.headers: false
        # Idempotent producer: no duplicates on broker retry
        enable.idempotence: true

eventflow:
  topics:
    orders: ${KAFKA_TOPIC:orders}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
